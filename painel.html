<style>
:root{
  --paper:#F3F6F5; --surface:#FFFFFF; --surface-2:#F8FAF9; --ink:#17201D; --muted:#5B6964;
  --rule:#D9E1DE; --rule-strong:#B9C6C1; --pine:#1E5240; --pine-ink:#FFFFFF; --pine-soft:#E2EDE8;
  --amber:#9A5F0C; --amber-soft:#FBF0DC; --up:#1D6B45; --down:#A8322A;
  --shadow:0 1px 2px rgba(23,32,29,.06),0 8px 24px rgba(23,32,29,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101614; --surface:#18201D; --surface-2:#1C2522; --ink:#E6EDEA; --muted:#98A7A1;
    --rule:#2A3632; --rule-strong:#3B4A45; --pine:#76C3A1; --pine-ink:#0E1A15; --pine-soft:#1D2E27;
    --amber:#E6AA52; --amber-soft:#33281A; --up:#7ACB9E; --down:#F08A80;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101614; --surface:#18201D; --surface-2:#1C2522; --ink:#E6EDEA; --muted:#98A7A1;
  --rule:#2A3632; --rule-strong:#3B4A45; --pine:#76C3A1; --pine-ink:#0E1A15; --pine-soft:#1D2E27;
  --amber:#E6AA52; --amber-soft:#33281A; --up:#7ACB9E; --down:#F08A80;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}

/* Cabeçalho */
.masthead{background:var(--pine);color:var(--pine-ink)}
.masthead-inner{max-width:1480px;margin:0 auto;padding:28px 28px 26px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}
.gov{font-size:13px;font-weight:600;opacity:.85;margin:0 0 6px}
.masthead h1{margin:0;font-size:clamp(28px,4vw,44px);line-height:1.05;font-weight:800;letter-spacing:-.02em}
.org{margin:10px 0 0;font-size:15px;opacity:.9}
.meta{display:grid;grid-template-columns:auto auto;gap:4px 18px;font-size:13px;margin:0}
.meta dt{opacity:.75}
.meta dd{margin:0;font-weight:600}

/* Resumo */
.wrap{max-width:1480px;margin:0 auto;padding:0 28px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--rule);border-radius:10px;margin:-1px 0 0;transform:translateY(-18px);box-shadow:var(--shadow)}
.stat{padding:16px 20px;border-left:1px solid var(--rule)}
.stat:first-child{border-left:0}
.stat b{display:block;font-size:26px;font-weight:700;letter-spacing:-.01em}
.stat span{font-size:13px;color:var(--muted)}
.stat.changed b{color:var(--amber)}

.notice{display:flex;gap:12px;align-items:flex-start;background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);color:var(--ink);border-radius:8px;padding:12px 16px;margin:0 0 16px;font-size:14px}
.notice svg{flex:none;margin-top:2px;color:var(--amber)}

/* Barra de ferramentas */
.toolbar{position:sticky;top:0;z-index:20;background:var(--paper);padding:12px 0;border-bottom:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
.toolbar{top:env(safe-area-inset-top,0px)}
.search{flex:1 1 280px;position:relative}
.search input{width:100%;height:40px;border:1px solid var(--rule-strong);border-radius:8px;background:var(--surface);padding:0 12px 0 38px}
.search svg{position:absolute;left:12px;top:11px;color:var(--muted)}
select{flex:0 1 300px;min-width:0;height:40px;border:1px solid var(--rule-strong);border-radius:8px;background:var(--surface);padding:0 10px;max-width:100%}
.check{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);user-select:none}
.btn{height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--rule-strong);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--pine)}
.btn.primary{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.btn.ghost{background:transparent}

/* Layout principal */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start;padding:16px 0 40px}
.table-wrap{background:var(--surface);border:1px solid var(--rule);border-radius:10px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:880px}
thead th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:12.5px;font-weight:700;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--rule-strong);white-space:nowrap}
th.num,td.num{text-align:right}
tbody td{padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:middle;font-size:14px}
tr.group td{background:var(--pine-soft);border-bottom:1px solid var(--rule-strong);padding:12px}
.group-title{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:baseline}
.group-title strong{font-size:15px}
.group-title code{font-family:inherit;font-weight:600;color:var(--pine);margin-right:8px}
.group-title small{color:var(--muted);font-size:13px}
tr.item:hover td{background:var(--surface-2)}
tr.item.active td{background:var(--pine-soft)}
tr.item.edited td.adj{background:var(--amber-soft)}
.thumb{width:56px;height:56px;border-radius:8px;border:1px solid var(--rule);background:var(--surface-2);overflow:hidden;cursor:zoom-in;display:block;padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.thumb:hover img{transform:scale(1.08)}
.code{font-weight:600;white-space:nowrap}
.desc{max-width:52ch}
.desc .full{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;margin-top:4px;font-size:12px;color:var(--muted);border:1px solid var(--rule);border-radius:4px;padding:1px 6px}
.unit{font-size:13px;color:var(--muted);white-space:nowrap}
.qty{font-weight:600;white-space:nowrap}
.stepper{display:inline-flex;align-items:stretch;border:1px solid var(--rule-strong);border-radius:8px;overflow:hidden;background:var(--surface)}
.stepper button{width:32px;border:0;background:transparent;cursor:pointer;font-size:17px;line-height:1;color:var(--muted)}
.stepper button:hover{background:var(--pine-soft);color:var(--ink)}
.stepper input{width:88px;height:36px;border:0;border-left:1px solid var(--rule);border-right:1px solid var(--rule);text-align:right;padding:0 8px;background:transparent;font-weight:600;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.diff{font-weight:600;white-space:nowrap;font-size:13.5px}
.diff.up{color:var(--up)} .diff.down{color:var(--down)} .diff.zero{color:var(--muted);font-weight:400}
tr.subtotal td{background:var(--surface-2);font-size:13.5px;font-weight:600;border-bottom:2px solid var(--rule-strong)}
tr.grand td{background:var(--pine);color:var(--pine-ink);font-weight:700;font-size:15px;border:0}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* Painel de visualização */
.preview{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.preview-img{aspect-ratio:1/1;background:var(--surface-2);display:grid;place-items:center;position:relative;border-bottom:1px solid var(--rule)}
.preview-img img{width:100%;height:100%;object-fit:contain;background:#fff}
.preview-img .badge{position:absolute;left:10px;bottom:10px;background:rgba(23,32,29,.78);color:#fff;font-size:11.5px;padding:3px 8px;border-radius:4px}
.preview-body{padding:16px 18px 18px}
.preview-body h2{margin:0 0 6px;font-size:16px;line-height:1.3}
.preview-body .pcode{font-size:13px;color:var(--muted);margin:0 0 12px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
.pgrid div{background:var(--surface-2);border:1px solid var(--rule);border-radius:8px;padding:8px 10px}
.pgrid span{display:block;font-size:12px;color:var(--muted)}
.pgrid b{font-size:18px}
.pgrid .wide{grid-column:1/-1}
.pgrid .wide b{font-size:13.5px;font-weight:600}
.plinks{display:flex;flex-wrap:wrap;gap:8px}
.plinks a,.plinks button{font-size:13px;color:var(--pine);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.psrc{font-size:12px;color:var(--muted);margin:10px 0 0}
.psrc a{color:inherit}
.thumb.loading img{opacity:.55}
.preview .hint{padding:24px 18px;color:var(--muted);font-size:14px}

/* Modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,15,13,.72);display:none;align-items:center;justify-content:center;padding:24px}
.modal.open{display:flex}
.modal-card{background:var(--surface);border-radius:12px;max-width:min(720px,100%);max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal-card img{display:block;width:100%;max-height:70vh;object-fit:contain;background:#fff}
.modal-card .cap{padding:14px 18px;display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.modal-card .cap p{margin:0;font-size:14px}
.modal-card .cap small{color:var(--muted)}

footer{border-top:1px solid var(--rule);padding:18px 0 32px;color:var(--muted);font-size:13px}
footer p{margin:4px 0}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1100px){
  .layout{grid-template-columns:1fr}
  .preview{display:none}
}
@media (max-width:720px){
  .masthead-inner{grid-template-columns:1fr;padding:22px 18px}
  .wrap{padding:0 14px}
  .summary{grid-template-columns:1fr 1fr}
  .stat:nth-child(3){border-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--rule)}
  .stat b{font-size:21px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  :root{--paper:#fff;--surface:#fff;--surface-2:#f4f4f4}
  .toolbar,.preview,.btn,.stepper button,.plinks,.modal,.toast{display:none!important}
  .layout{grid-template-columns:1fr}
  .summary{transform:none;box-shadow:none;margin-top:12px}
  .table-wrap{border:0;overflow:visible}
  table{min-width:0;font-size:11px}
  .stepper{border:0}
  .stepper input{border:0;width:auto}
  .thumb{width:36px;height:36px}
  tr{break-inside:avoid}
  thead th{position:static}
}

/* ===================== Acréscimos: pedidos e painel do gestor ===================== */
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.danger{color:var(--down)}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.masthead a{color:inherit}
.masthead .nav{display:flex;gap:16px;margin-top:12px;font-size:13.5px}
.masthead .nav a{opacity:.85}

/* Cartões e formulários */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:18px 20px;margin:0 0 16px}
.card h2{margin:0 0 2px;font-size:17px}
.card .sub{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.fields{display:grid;grid-template-columns:1.4fr 1.2fr .8fr 1.2fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;min-width:0}
.field input,.field textarea,.field select{width:100%;height:40px;border:1px solid var(--rule-strong);border-radius:8px;background:var(--surface);padding:0 10px;font-weight:400;font-size:14.5px;max-width:none;flex:none}
.field textarea{height:auto;min-height:60px;padding:8px 10px;resize:vertical}
.field.wide{grid-column:1/-1}
.field .err{display:none;color:var(--down);font-weight:500;font-size:12.5px}
.field.invalid input,.field.invalid select{border-color:var(--down)}
.field.invalid .err{display:block}
.saved-note{font-size:12.5px;color:var(--muted);margin:10px 0 0}

/* Seleção de itens */
th.sel,td.sel{width:44px;text-align:center;padding-left:14px;padding-right:4px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--pine);cursor:pointer;margin:0}
input[type=checkbox]:disabled{cursor:not-allowed}
tr.item.selected td{background:var(--pine-soft)}
tr.item.selected:hover td{background:color-mix(in srgb,var(--pine-soft) 80%,var(--surface-2))}
tr.item.zero td:not(.sel){opacity:.55}
.avail{font-weight:700;white-space:nowrap}
.avail.low{color:var(--amber)}
.avail.zero{color:var(--down)}
.avail small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.stepper.disabled{opacity:.45}
.stepper.over{border-color:var(--down)}
.stepper.over input{color:var(--down)}
.over-msg{display:block;font-size:11.5px;color:var(--down);margin-top:3px;text-align:right}

/* Barra do pedido */
.cartbar{position:sticky;bottom:0;z-index:25;margin:0 -28px;padding:12px 28px calc(env(safe-area-inset-bottom,0px) + 12px);background:var(--surface);border-top:1px solid var(--rule-strong);box-shadow:0 -6px 20px rgba(23,32,29,.08);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cartbar .count{font-size:15px}
.cartbar .count b{font-size:18px}
.cartbar .grow{flex:1}

/* Diálogos */
.dialog{width:min(680px,100%);display:flex;flex-direction:column}
.dialog header{padding:18px 20px 6px}
.dialog header h2{margin:0;font-size:19px}
.dialog header p{margin:6px 0 0;color:var(--muted);font-size:14px}
.dialog .body{padding:10px 20px;overflow:auto}
.dialog footer{border:0;padding:14px 20px 18px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;font-size:14px;color:var(--ink)}
.mini{width:100%;border-collapse:collapse;min-width:0;font-size:13.5px}
.mini th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--rule-strong);background:none;position:static}
.mini td{padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.mini td.num,.mini th.num{text-align:right;white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:0 0 12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.big-ok{display:flex;gap:14px;align-items:flex-start}
.big-ok .seal{flex:none;width:44px;height:44px;border-radius:50%;background:var(--pine);color:var(--pine-ink);display:grid;place-items:center}
.errbox{background:color-mix(in srgb,var(--down) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--down) 40%,transparent);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:14px;margin:8px 0}

/* Situação */
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.Pendente{background:var(--amber-soft);color:var(--amber)}
.pill.Entregue{background:var(--pine-soft);color:var(--pine)}
.pill.Cancelado{background:color-mix(in srgb,var(--down) 12%,var(--surface));color:var(--down)}

/* Abas do gestor */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule-strong);margin:0 0 16px;overflow-x:auto}
.tab{padding:11px 14px;border:0;background:none;font-weight:600;font-size:14.5px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pine)}
.tab .n{background:var(--amber);color:var(--surface);border-radius:999px;font-size:11.5px;padding:1px 7px}
.panel[hidden]{display:none}

/* Visão geral */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 16px}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
.kpi b{display:block;font-size:28px;letter-spacing:-.01em}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.warn b{color:var(--amber)}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0 0 16px}
.chart-card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
.chart-card h3{margin:0 0 2px;font-size:15px}
.chart-card p{margin:0 0 10px;font-size:12.5px;color:var(--muted)}
.chart-box{position:relative;height:260px}
.chart-empty{height:100%;display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.listcard{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;overflow-x:auto}
.listcard h3{margin:0 0 8px;font-size:15px}

/* Lista de pedidos */
tr.pedido{cursor:pointer}
tr.pedido:hover td,tr.pedido.pinned td{background:var(--surface-2)}
tr.pedido.Cancelado td{color:var(--muted)}
tr.pedido.novo td:first-child{box-shadow:inset 3px 0 0 var(--amber)}
.row-actions{display:flex;gap:6px;justify-content:flex-end;opacity:.35;transition:opacity .15s}
tr.pedido:hover .row-actions,tr.pedido.pinned .row-actions,tr.pedido:focus-within .row-actions{opacity:1}
.who b{display:block;font-weight:600}
.who small{color:var(--muted);font-size:12.5px}
.hovercard{position:fixed;z-index:40;width:min(540px,calc(100vw - 24px));max-height:min(72vh,640px);overflow:auto;background:var(--surface);border:1px solid var(--rule-strong);border-radius:10px;box-shadow:0 16px 48px rgba(10,15,13,.22);display:none}
.hovercard.open{display:block}
.hovercard .hc-head{padding:14px 16px 8px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid var(--rule)}
.hovercard .hc-head h3{margin:0;font-size:17px}
.hovercard .hc-head small{color:var(--muted)}
.hovercard .hc-body{padding:12px 16px}
.hovercard .hc-actions{padding:10px 16px 14px;display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--rule);position:sticky;bottom:0;background:var(--surface)}

/* Estoque do gestor */
tr.item.dirty td{background:var(--amber-soft)}
tr.item.low td.avail-cell{color:var(--amber)}
.savebar{position:sticky;bottom:0;z-index:25;margin:0 -28px;padding:12px 28px calc(env(safe-area-inset-bottom,0px) + 12px);background:var(--amber-soft);border-top:1px solid color-mix(in srgb,var(--amber) 45%,transparent);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.savebar input{flex:1 1 260px;height:40px;border:1px solid var(--rule-strong);border-radius:8px;background:var(--surface);padding:0 10px}
.savebar[hidden]{display:none}

/* Entrada do gestor */
.login{max-width:420px;margin:40px auto 60px}
.login .card{padding:24px}
.login h2{font-size:20px}
.login .field{margin:0 0 14px}
.login .btn{width:100%;justify-content:center}
.lock{width:44px;height:44px;border-radius:10px;background:var(--pine-soft);color:var(--pine);display:grid;place-items:center;margin:0 0 12px}

.updated{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--up)}
.dot.off{background:var(--down)}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:1000px){
  .fields{grid-template-columns:1fr 1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .charts,.split{grid-template-columns:1fr}
}
@media (max-width:720px){
  .cartbar,.savebar{margin:0 -14px;padding-left:14px;padding-right:14px}
  .fields{grid-template-columns:1fr}
  .hovercard{left:12px!important;right:12px;top:auto!important;bottom:12px;width:auto}
}
@media print{
  .cartbar,.savebar,.tabs,.hovercard,.row-actions{display:none!important}
}

.mini td:first-child{white-space:nowrap}
main a,.hovercard a{color:var(--pine)}

/* ===================== Versão 2: situações, catálogo gerenciável, acompanhamento ===================== */
:root{--azul:#2C62A8;--roxo:#7A4FA0}
@media (prefers-color-scheme:dark){:root{--azul:#8DB4E6;--roxo:#C3A2E0}}
.pill.pendente{background:var(--amber-soft);color:var(--amber)}
.pill.aprovado{background:color-mix(in srgb,var(--azul) 14%,var(--surface));color:var(--azul)}
.pill.parcial{background:color-mix(in srgb,var(--roxo) 14%,var(--surface));color:var(--roxo)}
.pill.atendido{background:var(--pine-soft);color:var(--pine)}
.pill.recusado{background:color-mix(in srgb,var(--down) 12%,var(--surface));color:var(--down)}
.indisp{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.04em;color:var(--down);border:1.5px solid currentColor;border-radius:4px;padding:1px 6px;white-space:nowrap}
.limite{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.btn.danger-fill{background:var(--down);border-color:var(--down);color:#fff}
.btn.danger-fill:hover{filter:brightness(1.08)}
.dialog.largo{width:min(920px,100%)}
.dialog .body .field{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.hint-txt{font-size:12.5px;color:var(--muted);font-weight:400}
.check-row{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin:4px 0 12px}

/* Página inicial */
.inicio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:24px 0}
.porta{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:22px;text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s}
.porta:hover{border-color:var(--pine);transform:translateY(-2px)}
.porta .ico{width:46px;height:46px;border-radius:10px;background:var(--pine-soft);color:var(--pine);display:grid;place-items:center}
.porta h2{margin:0;font-size:19px}
.porta p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.45}
.porta .ir{margin-top:auto;font-weight:700;color:var(--pine);font-size:14.5px}

/* Andamento (linha do tempo) */
.timeline{list-style:none;margin:6px 0 14px;padding:0 0 0 18px;border-left:2px solid var(--rule-strong)}
.timeline li{position:relative;margin:0 0 12px;padding-left:6px;font-size:14px}
.timeline li::before{content:"";position:absolute;left:-25px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--pine);border:2px solid var(--surface)}
.timeline li small{display:block;color:var(--muted);font-size:12.5px}

/* Miniaturas em tabelas pequenas */
.mini .tn{width:44px;height:44px;border-radius:6px;object-fit:cover;background:var(--pine-soft);display:block}
.mini td.tn-cell{width:52px;padding-right:0}
.mini input[type=number]{width:80px;height:34px;border:1px solid var(--rule-strong);border-radius:6px;padding:0 8px;text-align:right;background:var(--surface)}

/* Seletor de imagem no cadastro */
.img-edit{display:grid;grid-template-columns:160px 1fr;gap:16px;align-items:start;margin:4px 0 14px}
.img-edit .atual{width:160px;height:160px;border-radius:10px;border:1px solid var(--rule);background:var(--pine-soft);object-fit:contain}
.img-edit .opcoes{display:flex;flex-direction:column;gap:8px}
.img-edit .linha{display:flex;gap:8px;flex-wrap:wrap}
.img-edit .linha input{flex:1 1 200px;height:36px;border:1px solid var(--rule-strong);border-radius:8px;padding:0 10px;background:var(--surface)}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;margin-top:6px;max-height:220px;overflow:auto}
.picker button{padding:0;border:2px solid transparent;border-radius:8px;background:var(--pine-soft);aspect-ratio:1;cursor:pointer;overflow:hidden}
.picker button img{width:100%;height:100%;object-fit:cover;display:block}
.picker button:hover,.picker button.on{border-color:var(--pine)}

/* Interruptor */
.switch{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:600}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .trilho{width:38px;height:22px;border-radius:999px;background:var(--rule-strong);position:relative;transition:background .15s;flex:none}
.switch .trilho::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked + .trilho{background:var(--down)}
.switch input:checked + .trilho::after{transform:translateX(16px)}
.switch input:focus-visible + .trilho{outline:2px solid var(--pine);outline-offset:2px}

tr.item.indisponivel td:not(.sel):not(.acoes){opacity:.6}
tr.item.inativo td{opacity:.45}
td.acoes{white-space:nowrap;text-align:right}
.consulta-form{display:grid;grid-template-columns:1fr 1.4fr auto;gap:10px;align-items:end}
.assist{background:var(--surface);border:1px dashed var(--pine);border-radius:10px;padding:16px 18px;margin:0 0 16px}
.assist h2{margin:0 0 4px;font-size:16px}
.assist ol{margin:8px 0 0;padding-left:20px;font-size:14px;line-height:1.6}
.assist code{background:var(--pine-soft);padding:1px 5px;border-radius:4px}

@media (max-width:900px){
  .inicio{grid-template-columns:1fr}
  .grid2,.grid3,.consulta-form{grid-template-columns:1fr}
  .img-edit{grid-template-columns:1fr}
}
.sr,.sr-txt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* ===================== Versão 3: dados obrigatórios do solicitante ===================== */
.card.solicitante{margin-top:16px;border-left:4px solid var(--pine)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.card-head .sub{margin:2px 0 0}
.obrig{font-size:12.5px;color:var(--muted);white-space:nowrap}
.req{color:var(--down);font-weight:800}
.field .lbl{display:block}
.status-dados{margin:12px 0 0;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.status-dados::before{content:"";width:8px;height:8px;border-radius:50%;flex:none}
.status-dados.pendente{color:var(--amber)}
.status-dados.pendente::before{background:var(--amber)}
.status-dados.ok{color:var(--up)}
.status-dados.ok::before{background:var(--up)}
tr.item.edited td{background:color-mix(in srgb,var(--amber-soft) 55%,var(--surface))}
tr.item.edited td.adj{background:var(--amber-soft)}
tr.item.indisponivel td.qty{opacity:1}
@media print{ .card.solicitante .status-dados,.card.solicitante textarea{display:none} }
/* Ajustes de largura da tabela do solicitante (8 colunas) */
#tbl{min-width:820px}
#tbl .stepper input{width:58px}
#tbl .stepper button{width:30px}
#tbl td.unit{max-width:130px;font-size:12px;line-height:1.3}
#tbl td.desc{min-width:180px}
#tbl td.diff,#tbl td.qty{white-space:nowrap}
#tbl th,#tbl td{padding-left:10px;padding-right:10px}
.toolbar .search{flex:1 1 200px}
.toolbar select{flex:0 1 250px}
#tbl thead th{white-space:normal;line-height:1.25;vertical-align:bottom}
#tbl thead th.num{width:92px}
#tbl td.code{white-space:nowrap}
#tbl td.qty .limite{white-space:normal}
@media (min-width:1101px) and (max-width:1320px){ .layout{grid-template-columns:minmax(0,1fr) 280px} #tbl td.desc{min-width:160px} }

/* ===================== Versão 4: fotos do catálogo, gestores, relatórios ===================== */
.thumb img.foto,.mini .tn.foto{object-fit:contain;background:#fff}
.preview-img.com-foto{background:#fff}
.preview-img.com-foto img{object-fit:contain;padding:12px}
.modal-card img.foto{object-fit:contain;background:#fff}
.oculto-tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--muted);border:1.5px solid currentColor;border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px}
tr.item.oculto td:not(.acoes):not(.sw){opacity:.5}
.switch.verde input:checked + .trilho{background:var(--up)}
.filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;margin:0 0 14px}
.filtros .field{min-width:150px;flex:1 1 150px}
.filtros .field input,.filtros .field select{height:36px}
.filtros .acao{flex:0 0 auto}
.filtro-resumo{font-size:13px;color:var(--muted);margin:-6px 0 14px}
.rel-tipos{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:0 0 14px}
.rel-tipo{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1.5px solid var(--rule);border-radius:10px;padding:12px 14px;cursor:pointer;font-size:14px}
.rel-tipo input{margin-top:3px;accent-color:var(--pine)}
.rel-tipo b{display:block}
.rel-tipo small{color:var(--muted);font-size:12.5px;line-height:1.35;display:block;margin-top:2px}
.rel-tipo:has(input:checked){border-color:var(--pine);background:var(--pine-soft)}
.rel-acoes{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.rel-cab{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline;margin:0 0 8px}
.rel-cab h3{margin:0;font-size:17px}
.rel-cab small{color:var(--muted)}
table.rel{min-width:700px}
table.rel tfoot td{font-weight:700;background:var(--surface-2);border-top:2px solid var(--rule-strong)}
.gest-lista{display:grid;gap:8px;margin:0 0 14px}
.gest{display:flex;align-items:center;gap:12px;border:1px solid var(--rule);border-radius:8px;padding:10px 12px;flex-wrap:wrap}
.gest .av{width:36px;height:36px;border-radius:50%;background:var(--pine-soft);color:var(--pine);display:grid;place-items:center;font-weight:800}
.gest .info{flex:1;min-width:160px}
.gest .info b{display:block}
.gest .info small{color:var(--muted)}
.selo{font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--pine-soft);color:var(--pine);margin-left:6px}
.img-mini{display:flex;gap:14px;align-items:center;margin:0 0 12px}
.img-mini img{width:96px;height:96px;object-fit:contain;background:#fff;border:1px solid var(--rule);border-radius:8px}
.img-mini .bts{display:flex;gap:8px;flex-wrap:wrap}

/* ===================== Versão 5: identidade do órgão, recuperação de senha, imagens ===================== */
.marca{background:#fff;border-bottom:4px solid var(--pine);padding-top:env(safe-area-inset-top,0px)}
.marca-inner{max-width:1400px;margin:0 auto;padding:10px 28px;display:flex;align-items:center;gap:22px}
.marca-logo{height:110px;width:auto;display:block}
.marca-txt{display:flex;flex-direction:column;gap:4px;color:#1E5240;border-left:2px solid #E2EDE8;padding-left:22px}
.marca-txt b{font-size:22px;letter-spacing:-.01em;line-height:1.15}
.marca-txt span{font-size:14px;color:#5B6964}
@media (prefers-color-scheme:dark){ .marca{background:#fff} }
@media (max-width:720px){ .marca-inner{padding:8px 14px;gap:12px} .marca-logo{height:72px} .marca-txt{padding-left:12px} .marca-txt b{font-size:16px} .marca-txt span{font-size:12px} }
@media print{ .marca{border-bottom-width:2px} .marca-logo{height:80px} }
.link-acao{background:none;border:0;padding:0;color:var(--pine);text-decoration:underline;cursor:pointer;font:inherit;font-size:13.5px}
.recup-passos{font-size:13.5px;color:var(--muted);margin:0 0 12px}
.codigo-input{letter-spacing:.4em;font-size:20px!important;text-align:center;font-weight:700}
.gest .info small{display:block}
.gest .bts{display:flex;gap:6px;flex-wrap:wrap}
.thumb-edit{cursor:pointer!important;position:relative}
.thumb-edit:hover::after{content:"✎";position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:var(--pine);color:#fff;font-size:12px;display:grid;place-items:center}
.img-dlg{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
.img-dlg .quadro{width:260px;height:260px;border:1px solid var(--rule);border-radius:10px;background:#fff;object-fit:contain}
.soltar{border:2px dashed var(--rule-strong);border-radius:10px;padding:18px;text-align:center;font-size:14px;color:var(--muted);margin:0 0 10px;transition:border-color .15s,background .15s}
.soltar.ativo{border-color:var(--pine);background:var(--pine-soft);color:var(--pine)}
.img-dlg .bts{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
@media (max-width:720px){ .img-dlg{grid-template-columns:1fr} .img-dlg .quadro{width:100%;height:auto;aspect-ratio:1} }

/* ===================== Versão 6: materiais sem imagem (quadrinho em branco) ===================== */
.thumb img{background:#fff}
.thumb{background:#fff;border:1px solid var(--rule)}
.thumb.vazia{border:1.5px dashed var(--rule-strong)}
.thumb.vazia::before{content:"+ imagem";position:absolute;inset:0;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--muted);pointer-events:none}
.thumb.thumb-edit{position:relative}
.preview-img .sem-img{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;color:var(--muted);border:1.5px dashed var(--rule-strong);margin:14px;border-radius:10px}
.preview-img{position:relative;background:#fff}

/* ===================== Versão 7: LGPD e backup ===================== */
.check-row.lembrar{margin:14px 0 0;font-weight:600}
.check-row.lembrar .hint-txt{font-weight:400}
.ciencia{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.ciencia a,.privacidade a{color:var(--pine)}
.privacidade{padding:0;overflow:hidden}
.privacidade summary{cursor:pointer;padding:14px 20px;font-weight:700;font-size:15px;list-style:none;display:flex;align-items:center;gap:10px}
.privacidade summary::-webkit-details-marker{display:none}
.privacidade summary::after{content:"▸";margin-left:auto;color:var(--muted);transition:transform .15s}
.privacidade[open] summary::after{transform:rotate(90deg)}
.priv-corpo{padding:0 20px 16px;font-size:14px;line-height:1.55;border-top:1px solid var(--rule)}
.priv-corpo p{margin:10px 0 0}
.backup-card .rel-acoes{margin:10px 0 0}
.backup-info{font-size:13px;margin:12px 0 0;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.backup-info .pill{white-space:nowrap}
@media print{ .privacidade:not([open]){display:none} }

/* ===================== Versão 9: só visualização ===================== */
.so-consulta{display:inline-block;margin-top:3px;font-size:10.5px;font-weight:800;letter-spacing:.04em;color:var(--azul);border:1.5px solid currentColor;border-radius:4px;padding:1px 6px;white-space:nowrap}
#tbl td.qty .so-consulta{display:block;width:max-content;margin-left:auto}
tr.item.consulta td.adj .stepper{opacity:.45}
.switch.azul input:checked + .trilho{background:var(--azul)}
.consulta-tag{color:var(--azul)}
.pgrid .so-consulta{display:inline-block;width:max-content}

/* ===================== Versão 10: telas responsivas (celular, tablet e desktop) ===================== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
img{max-width:100%}
.barra-movel{display:none}
@media (max-width:1100px){
  .layout{grid-template-columns:minmax(0,1fr)}
}

/* ---------- Tablet e celular (até 900 px): tabelas viram cartões ---------- */
@media (max-width:900px){
  .table-wrap:has(table.cartoes),.table-wrap:has(table.t-cat){background:transparent;border:0;overflow:visible}
  table.cartoes,table.t-cat{min-width:0}
  table.cartoes thead,table.t-cat thead{display:none}
  table.cartoes,table.cartoes tbody,table.cartoes tfoot,table.t-cat,table.t-cat tbody{display:block;width:100%}
  table.cartoes tr{display:block;background:var(--surface);border:1px solid var(--rule);border-radius:10px;margin:0 0 10px;padding:10px 14px;box-shadow:var(--shadow)}
  table.cartoes td{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;border:0;padding:5px 0;text-align:right;white-space:normal!important;min-width:0;max-width:none}
  table.cartoes td::before{content:attr(data-label);flex:none;max-width:42%;text-align:left;font-size:12.5px;font-weight:600;color:var(--muted)}
  table.cartoes td[data-label=""]::before{display:none}
  table.cartoes td[data-label=""]{justify-content:flex-start;text-align:left}
  table.cartoes td.empty,table.cartoes td[colspan]{display:block;text-align:center}
  table.cartoes td > *{min-width:0;overflow-wrap:anywhere}
  table.cartoes tfoot tr{background:var(--surface-2)}
  /* Pedidos do gestor: número e situação em destaque; toque abre o detalhe */
  table.t-pedidos tr.pedido td:first-child{font-size:16px;border-bottom:1px solid var(--rule);padding-bottom:8px;margin-bottom:4px}
  table.t-pedidos .row-actions{opacity:1;justify-content:flex-end}
  table.t-pedidos tr.pedido.novo td:first-child{box-shadow:none}
  table.t-pedidos tr.pedido.novo{border-left:4px solid var(--amber)}
  table.t-pedidos .who b,table.t-pedidos .who small{text-align:right}
  /* Catálogo do gestor em cartões */
  table.t-cat tr.group{display:block;margin:14px 0 6px}
  table.t-cat tr.group td{display:block;border-radius:8px}
  table.t-cat tr.item{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--rule);border-radius:10px;margin:0 0 10px;padding:12px;box-shadow:var(--shadow)}
  table.t-cat tr.item td{display:block;border:0;padding:0;min-width:0;max-width:none;white-space:normal}
  table.t-cat tr.item td:nth-child(1){grid-column:1;grid-row:1 / span 3}
  table.t-cat tr.item td:nth-child(2){grid-column:2;grid-row:1;font-weight:700}
  table.t-cat tr.item td:nth-child(11){grid-column:3;grid-row:1}
  table.t-cat tr.item td:nth-child(3){grid-column:2 / span 2;grid-row:2}
  table.t-cat tr.item td:nth-child(4){grid-column:2 / span 2;grid-row:3}
  table.t-cat tr.item td:nth-child(5),table.t-cat tr.item td:nth-child(6){grid-row:4;text-align:left;font-size:13px}
  table.t-cat tr.item td:nth-child(5){grid-column:1 / span 2}
  table.t-cat tr.item td:nth-child(6){grid-column:3;text-align:right}
  table.t-cat tr.item td:nth-child(5)::before,table.t-cat tr.item td:nth-child(6)::before{content:attr(data-label) ": ";color:var(--muted);font-weight:600}
  table.t-cat tr.item td:nth-child(7){grid-column:1 / -1;grid-row:5;display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--rule);padding-top:10px;margin-top:4px}
  table.t-cat tr.item td:nth-child(7)::before{content:"Quantidade disponível";font-size:13px;font-weight:600;color:var(--muted)}
  table.t-cat tr.item td:nth-child(7) .over-msg{flex-basis:100%;text-align:right}
  table.t-cat tr.item td:nth-child(7){flex-wrap:wrap}
  table.t-cat tr.item td:nth-child(8),table.t-cat tr.item td:nth-child(9),table.t-cat tr.item td:nth-child(10){grid-row:6;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);font-weight:600;text-align:center}
  table.t-cat tr.item td:nth-child(8){grid-column:1}
  table.t-cat tr.item td:nth-child(9){grid-column:2}
  table.t-cat tr.item td:nth-child(10){grid-column:3}
  table.t-cat tr.item td:nth-child(8)::after,table.t-cat tr.item td:nth-child(9)::after,table.t-cat tr.item td:nth-child(10)::after{content:attr(data-label)}
  table.t-cat tr.item td.desc .full{-webkit-line-clamp:3}
  table.t-cat tr.item.dirty{border-color:var(--amber)}
  table.t-cat tr.item.dirty td{background:transparent}
  /* Gráficos e indicadores */
  .chart-box{height:230px}
  .split{grid-template-columns:1fr}
  .listcard{overflow-x:visible}
}

/* ---------- Celular (até 760 px) ---------- */
@media (max-width:760px){
  body{font-size:15px}
  .masthead h1{font-size:clamp(26px,8vw,40px);line-height:1.08}
  .masthead-inner{gap:14px}
  .meta{font-size:12.5px;gap:3px 12px}
  .summary{transform:translateY(-12px)}
  .stat{padding:12px 14px}
  .stat b{font-size:22px}
  /* Barras de ferramentas e filtros: não fixas, campos na largura toda */
  .toolbar{position:static;padding:10px 0;gap:8px}
  .toolbar .search,.toolbar select{flex:1 1 100%;max-width:none;width:100%}
  .toolbar .btn{flex:1 1 auto;justify-content:center}
  .toolbar .check{flex:1 1 100%}
  .filtros{padding:10px 12px;gap:8px}
  .filtros .field{flex:1 1 100%;min-width:0}
  .filtros .acao{flex:1 1 100%}
  .rel-acoes .btn,.backup-card .rel-acoes .btn{flex:1 1 100%;justify-content:center}
  .card{padding:14px 14px}
  .card-head{flex-direction:column;gap:4px}
  .fields{grid-template-columns:1fr}
  .tabs{margin-left:-14px;margin-right:-14px;padding:0 14px;scroll-snap-type:x proximity}
  .tab{scroll-snap-align:start;padding:11px 12px}
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .kpi{padding:12px}
  .kpi b{font-size:22px}
  .charts{grid-template-columns:1fr}
  /* Diálogos ocupam a tela; botões grandes e empilhados */
  .modal{padding:8px;align-items:flex-end}
  .modal-card,.dialog,.dialog.largo{width:100%;max-width:100%;max-height:calc(100dvh - 16px);border-radius:14px}
  .dialog header{padding:16px 16px 4px}
  .dialog .body{padding:8px 16px}
  .dialog footer{flex-direction:column-reverse;align-items:stretch;padding:12px 16px 16px}
  .dialog footer .btn{width:100%;justify-content:center;margin:0!important}
  .kv{grid-template-columns:1fr;gap:0}
  .kv dt{margin-top:6px;font-size:12.5px}
  .grid2,.grid3,.consulta-form,.img-dlg{grid-template-columns:1fr}
  /* Listas dentro dos diálogos e do detalhe do pedido viram cartões */
  table.mini thead{display:none}
  table.mini,table.mini tbody,table.mini tr,table.mini td{display:block;width:100%}
  table.mini tr{border:1px solid var(--rule);border-radius:8px;padding:6px 10px;margin:0 0 8px}
  table.mini td{border:0;padding:3px 0;display:flex;justify-content:space-between;gap:12px;text-align:right}
  table.mini td::before{content:attr(data-label);color:var(--muted);font-size:12px;font-weight:600;text-align:left;flex:none}
  table.mini td[data-label=""]::before{display:none}
  table.mini td.tn-cell{display:none}
  table.mini td input[type=number]{width:96px;height:40px}
  /* Detalhe do pedido (gestor): folha que sobe do rodapé */
  .hovercard{left:0!important;right:0;bottom:0;top:auto!important;width:100%;max-height:82dvh;border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .hovercard .hc-actions .btn{flex:1 1 calc(50% - 8px);justify-content:center;margin:0!important}
  /* Área de toque confortável (mín. 44 px) */
  .btn{min-height:44px}
  .btn.sm{min-height:38px}
  .stepper button{min-width:40px;min-height:40px}
  input[type=checkbox]{width:22px;height:22px}
  .switch .trilho{width:46px;height:28px}
  .switch .trilho::after{width:22px;height:22px}
  .switch input:checked + .trilho::after{transform:translateX(18px)}
  .savebar input{flex:1 1 100%}
  .savebar .btn{flex:1 1 auto;justify-content:center}
  .gest{align-items:flex-start}
  .gest .bts{width:100%}
  .gest .bts .btn{flex:1 1 auto;justify-content:center}
  .rel-tipos{grid-template-columns:1fr}
  footer{padding-bottom:12px}

  /* Barra fixa "Enviar pedido" no rodapé do celular */
  .barra-movel{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--rule-strong);box-shadow:0 -6px 18px rgba(0,0,0,.10)}
  .barra-movel .bm-resumo{font-size:14px}
  .barra-movel .btn{flex:none}
  .barra-movel.tem-itens{border-top:3px solid var(--amber)}
  body:has(.barra-movel){padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .toolbar #btn-enviar{display:none}
}

/* ---------- Celulares pequenos (até 380 px) ---------- */
@media (max-width:380px){
  .wrap{padding:0 10px}
  .tabs{margin-left:0;margin-right:0;padding:0}
  .marca-logo{height:60px}
  .marca-txt b{font-size:14.5px}
  .summary{grid-template-columns:1fr 1fr}
  #tbl tr.item{grid-template-columns:28px 60px minmax(0,1fr) auto;padding:10px}
  #tbl tr.item td:nth-child(2) .thumb{width:60px;height:60px}
  .kpis{grid-template-columns:1fr}
}

/* ---------- Telas com toque: sem efeitos que dependem do mouse ---------- */
@media (hover:none){
  .row-actions{opacity:1}
  .thumb-edit:hover::after{display:none}
}
@media (max-width:900px){
  table.cartoes td,table.t-cat tr.item td{background:transparent!important}
  table.t-pedidos td.who{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);column-gap:14px}
  table.t-pedidos td.who::before{grid-row:1 / span 2}
  table.t-pedidos td.who b,table.t-pedidos td.who small{grid-column:2;text-align:right;overflow-wrap:anywhere}
}
@media (max-width:760px){
  table.mini td{flex-wrap:wrap}
  table.mini td small{flex-basis:100%;text-align:right}
  }

/* Solicitante: cada material vira um cartão (celular e tablet) */
@media (max-width:900px){
  /* ---------- Solicitante: cada material vira um cartão ---------- */
  #tbl{min-width:0}
  .layout .table-wrap{background:transparent;border:0;overflow:visible}
  #tbl thead{display:none}
  #tbl,#tbl tbody{display:block;width:100%}
  #tbl tr.group{display:block;margin:14px 0 6px}
  #tbl tr.group td{display:block;border-radius:8px}
  #tbl tr.item{display:grid;grid-template-columns:30px 72px minmax(0,1fr) auto;grid-template-areas:"sel img cod qtd" "sel img desc desc" "sel img uni uni" "adj adj adj saldo";gap:4px 10px;align-items:center;background:var(--surface);border:1px solid var(--rule);border-radius:12px;margin:0 0 10px;padding:12px;box-shadow:var(--shadow)}
  #tbl tr.item td{display:block;border:0;padding:0!important;min-width:0!important;max-width:none!important;background:transparent!important;white-space:normal}
  #tbl tr.item td:nth-child(1){grid-area:sel;align-self:start;padding-top:4px!important}
  #tbl tr.item td:nth-child(2){grid-area:img}
  #tbl tr.item td:nth-child(2) .thumb{width:72px;height:72px}
  #tbl tr.item td:nth-child(3){grid-area:cod;font-size:13px}
  #tbl tr.item td:nth-child(4){grid-area:desc;font-size:14.5px;font-weight:600;line-height:1.3}
  #tbl tr.item td:nth-child(5){grid-area:uni;font-size:12.5px}
  #tbl tr.item td:nth-child(6){grid-area:qtd;text-align:right;white-space:nowrap}
  #tbl tr.item td:nth-child(7){grid-area:adj;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:10px!important;margin-top:6px}
  #tbl tr.item td:nth-child(7)::before{content:"Quantidade";font-size:13px;font-weight:600;color:var(--muted)}
  #tbl tr.item td:nth-child(7) .over-msg{flex-basis:100%;text-align:left}
  #tbl tr.item td:nth-child(8){grid-area:saldo;align-self:end;text-align:right;border-top:1px solid var(--rule);padding-top:10px!important;margin-top:6px;font-size:13px}
  #tbl tr.item td:nth-child(8)::before{content:"Saldo";display:block;font-size:11.5px;font-weight:600;color:var(--muted)}
  #tbl tr.item td.desc .full{display:block;-webkit-line-clamp:4}
  #tbl tr.item td.desc .tag{display:inline-block;margin-top:4px}
  #tbl .stepper input{width:64px}
  #tbl tr.item.edited{border-color:var(--amber);background:color-mix(in srgb,var(--amber-soft) 40%,var(--surface))}
  #tbl tr.subtotal,#tbl tr.grand{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 14px;border-radius:10px;margin:0 0 14px;padding:10px 12px}
  #tbl tr.subtotal{background:var(--surface-2)}
  #tbl tr.grand{background:var(--pine);color:var(--pine-ink)}
  #tbl tr.subtotal td,#tbl tr.grand td{display:block;border:0;padding:0;background:transparent;font-size:13px}
  #tbl tr.subtotal td:first-child,#tbl tr.grand td:first-child{flex-basis:100%;font-weight:700}
  #tbl tr.subtotal td:not(:first-child)::before,#tbl tr.grand td:not(:first-child)::before{content:attr(data-label);display:block;font-size:11px;font-weight:600;opacity:.75}
  #tbl tr.item td.desc .full{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;white-space:normal}
  #tbl tr.item td{background:transparent!important}
}

}

/* ===================== Versão 12: aviso SIADES, mini imagens, gráficos e dashboard ===================== */

.aviso-siades p{margin:0;font-size:14.5px;line-height:1.6;color:var(--ink)}

.mini-img{width:40px;height:40px;border-radius:6px;border:1px solid var(--rule);background:#fff;object-fit:contain;display:inline-block;vertical-align:middle;flex:none}
.mini-img.vazia{background:repeating-linear-gradient(45deg,#fff,#fff 6px,var(--surface-2) 6px,var(--surface-2) 7px)}
.td-mini,.td-minis{width:1%;white-space:nowrap}
.td-minis .mini-img + .mini-img{margin-left:4px}
.minis{display:inline-flex;gap:3px;align-items:center;margin-right:8px;vertical-align:middle}
.minis .mini-img{width:28px;height:28px;border-radius:5px}

.rel-modo{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;padding:10px 16px;border-radius:9px;font:inherit;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}

.filtros .rf-mat-f{flex:2 1 280px}

.rel-graf{margin:0 0 14px}
/* Dashboard */
.dash-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:6px 0 16px}
.dash-kpi{position:relative;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:16px 16px 14px 18px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;gap:3px}
.dash-kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pine)}
.dash-kpi.k1::before{background:#3B8C6E} .dash-kpi.k2::before{background:#C9A227} .dash-kpi.k3::before{background:#3B6FA0} .dash-kpi.k4::before{background:#7A5195} .dash-kpi.k5::before{background:#D67800}
.dash-kpi b{font-size:28px;line-height:1.1;letter-spacing:-.02em;color:var(--ink)}
.dash-kpi span{font-size:13px;font-weight:700;color:var(--ink)}
.dash-kpi small{font-size:12px;color:var(--muted)}
.dash-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.dash-card{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}

.dash-card h3{font-size:15px;margin:0;color:var(--ink)}

.dash-box{position:relative;height:280px}
.dash-box.alto{height:320px}
.dash-card .table-wrap{margin-top:4px}

@media (max-width:760px){
  .rel-modos{display:flex;width:100%} .rel-modo{flex:1;justify-content:center;padding:10px 8px;font-size:13px}
  .dash-kpi b{font-size:22px} .dash-box,.dash-box.alto{height:240px}
  .dash-resumo{margin-left:0;flex-basis:100%}
  .aviso-siades{padding:14px;gap:10px} .aviso-siades .as-ico{width:34px;height:34px}

/* ===================== Versão 13: painel de gráficos para o Google Looker Studio ===================== */
.lk-passos{margin:0 0 10px;padding-left:20px;font-size:13.5px;line-height:1.6}

/* ===================== Versão 14: pedido abre ao clicar, numa janela, com coluna Estoque ===================== */
#tb-ped td.abre{cursor:pointer}
#tb-ped .lnk-ped{color:var(--pine);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--pine) 35%,transparent);text-underline-offset:3px}

.hovercard .hc-dir{display:flex;align-items:center;gap:10px}
.hc-fechar{width:34px;height:34px;border-radius:50%;border:1px solid var(--rule);background:var(--surface);color:var(--ink);font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center}

/* ===================== Versão 16: botões do pedido, confirmação em pergunta, retirada e entrega ===================== */
.pill.retirada{background:#E3ECF8;color:#2C5A8A}
.pill.entregue{background:var(--pine);color:#fff}
/* Botões de ação elegantes */
.hc-actions{display:flex;flex-direction:column;gap:10px}
.hc-actions .grupo{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hc-actions .grupo .espaco{flex:1 1 auto}
.btn-acao{--c:#5B6964;--c2:#46524E;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 16px;border-radius:10px;border:1px solid transparent;
  font:inherit;font-weight:700;font-size:14px;letter-spacing:.01em;color:#fff;cursor:pointer;background:linear-gradient(180deg,var(--c),var(--c2));
  box-shadow:0 1px 2px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .12s ease,box-shadow .12s ease,filter .12s ease}
.btn-acao svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn-acao:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.18);filter:brightness(1.05)}
.btn-acao:active{transform:translateY(0);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn-acao:focus-visible{outline:3px solid color-mix(in srgb,var(--c) 45%,transparent);outline-offset:2px}
.btn-acao:disabled{opacity:.6;cursor:default;transform:none}
.btn-acao.verde{--c:#2E7D5B;--c2:#1E5240}
.btn-acao.laranja{--c:#EC8A1C;--c2:#C96A00}
.btn-acao.vermelho{--c:#D64535;--c2:#B42318}
.btn-acao.azul{--c:#3D7CC4;--c2:#2A5F9E}
.btn-acao.cinza{--c:#7A8682;--c2:#5B6964}
.btn-acao.neutro{--c:var(--surface);--c2:var(--surface);color:var(--ink);border-color:var(--rule-strong);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.btn-acao.contorno{background:var(--surface);color:var(--c2);border-color:color-mix(in srgb,var(--c2) 55%,transparent);box-shadow:none}
.btn-acao.contorno:hover{background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.btn-acao.grande{min-height:52px;padding:12px 26px;font-size:16px;flex:1 1 100%}
.hc-actions .grupo.trat .btn-acao:not(.grande){flex:1 1 0;min-width:170px}
.etapa-final{margin:0;font-size:13.5px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:8px 12px}
/* Pergunta de confirmação dentro da janela */
.hc-pergunta{--c:#5B6964;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:start;border:1px solid color-mix(in srgb,var(--c) 35%,var(--rule));border-left:5px solid var(--c);border-radius:12px;padding:14px 16px;background:color-mix(in srgb,var(--c) 6%,var(--surface));animation:aparecer .18s ease}
.hc-pergunta.verde{--c:#1E5240} .hc-pergunta.laranja{--c:#C96A00} .hc-pergunta.vermelho{--c:#B42318} .hc-pergunta.azul{--c:#2A5F9E} .hc-pergunta.cinza{--c:#5B6964} .hc-pergunta.neutro{--c:#5B6964}
.hcq-ico{width:38px;height:38px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px}
.hcq-txt > b{display:block;font-size:15.5px;line-height:1.35;color:var(--ink)}
.hcq-txt p b{color:var(--ink)}
.hcq-txt p{margin:4px 0 0;font-size:13.5px;color:var(--muted);line-height:1.5}
.hcq-txt .field{margin-top:10px}
.hcq-bts{grid-column:1 / -1;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
@keyframes aparecer{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* Atendimento parcial e rascunho */
.parcial-tit{margin:0 0 4px;font-size:16px;color:#C96A00}
.rascunho-aviso{margin:12px 0 0;font-size:13.5px;background:#FFF4E5;border:1px solid #F3C98B;border-radius:8px;padding:8px 12px}
.rascunho-status{margin:8px 0 0;font-size:12.5px;color:var(--pine);font-weight:600;min-height:1em}
.parcial-bts .btn-acao{flex:0 0 auto!important;min-width:0!important}
@media (max-width:760px){
  .btn-acao{width:100%}
  .hc-actions .grupo .espaco{display:none}

/* ===================== Versão 17: botões padronizados, nome em caixa alta, status e linha do tempo ===================== */
/* Botões de gestão do pedido: uma cor por comando e todos do mesmo tamanho */
.hc-actions .grupo,.hc-actions .grupo.trat,.hc-actions .grupo.docs{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}

  font-size:13.5px;line-height:1.2;white-space:normal;text-align:center}
.hcq-bts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.hcq-bts .btn-acao{height:52px;width:100%}
.hcq-bts .btn-acao:first-child{grid-column:3}
.btn-acao.roxo{--c:#7C5CBF;--c2:#5E3F9E}
.btn-acao.bordo{--c:#9B2C2C;--c2:#7A1F1F}
.btn-acao.turquesa{--c:#14917F;--c2:#0E6E61}
.hc-pergunta.roxo{--c:#5E3F9E} .hc-pergunta.bordo{--c:#7A1F1F} .hc-pergunta.turquesa{--c:#0E6E61}

/* Nome completo do solicitante: sempre em caixa alta, tamanho 11 */
#nome{text-transform:uppercase;font-size:11pt;letter-spacing:.02em}
/* Status em destaque */
.status-painel{display:grid;grid-template-columns:minmax(200px,auto) 1fr;gap:18px;align-items:center;background:var(--surface-2);border:1px solid var(--rule);border-radius:14px;padding:14px 18px;margin:0 0 14px}
.status-card{--c:#D67800;display:flex;flex-direction:column;gap:2px;border-left:6px solid var(--c);background:var(--surface);border-radius:10px;padding:10px 14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.status-card .sc-rot{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.status-card b{font-size:21px;line-height:1.2;color:var(--c)}
.status-card small{font-size:12px;color:var(--muted)}
.status-card.s-pendente{--c:#C96A00} .status-card.s-retirada{--c:#2A5F9E} .status-card.s-entregue{--c:#1E5240}
.status-card.s-recusado{--c:#B42318} .status-card.s-aprovado{--c:#3B6FA0} .status-card.s-parcial{--c:#7A5195} .status-card.s-atendido{--c:#1E5240}
.status-msg{margin:-4px 0 14px;font-size:13.5px;color:var(--ink);background:var(--surface);border:1px dashed var(--rule-strong);border-radius:8px;padding:8px 12px}
/* Linha do tempo horizontal (checklist) */
.etapas{list-style:none;margin:0;padding:0;display:flex;align-items:flex-start}
.etapas li{flex:1 1 0;position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;min-width:0;padding:0 4px}
.etapas li::before{content:"";position:absolute;top:19px;right:50%;width:100%;height:4px;background:var(--rule-strong);border-radius:2px;z-index:0}
.etapas li:first-child::before{display:none}
.etapas li.feito::before,.etapas li.erro::before,.etapas li.aguardando::before{background:var(--pine)}
.etapas li.aguardando::before{background:linear-gradient(90deg,var(--pine),#E8A33D)}
.etapas li.erro::before{background:linear-gradient(90deg,var(--pine),#B42318)}
.et-ico{position:relative;z-index:1;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;background:var(--surface);border:3px solid var(--rule-strong);color:var(--muted)}
.et-ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

/* Funções usadas pelas duas páginas. */
(function(){
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmt = n => Math.round(Number(n || 0)).toLocaleString("pt-BR");   // quantidades sempre inteiras, sem vírgula
  const norm = s => String(s == null ? "" : s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  const dataHora = iso => { if(!iso) return ""; const d = new Date(iso); if(isNaN(d)) return ""; return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); };
  const SITUACAO_CLASSE = { "Pendente": "pendente", "Aguardando retirada": "retirada", "Entrega realizada": "entregue", "Recusado": "recusado", "Aprovado": "aprovado", "Parcialmente atendido": "parcial", "Atendido": "atendido" };
  const pill = s => `<span class="pill ${SITUACAO_CLASSE[s] || ""}">${esc(s)}</span>`;
  const emailOk = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(e || "").trim());

  function mascaraTelefone(input){
    input.addEventListener("input", () => {
      const d = input.value.replace(/\D/g, "").slice(0, 11); let v = d;
      if(d.length > 2) v = `(${d.slice(0,2)}) ` + (d.length > 10 ? d.slice(2,7) + "-" + d.slice(7) : d.length > 6 ? d.slice(2,6) + "-" + d.slice(6) : d.slice(2));
      input.value = v;
    });
  }

  let tt;
  function toast(m, ms){ let t = $("#toast"); if(!t){ t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); } t.textContent = m; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), ms || 3200); }

  /* Diálogo simples reutilizável */
  let dlg, card;
  function garantirDialogo(){
    if(dlg) return;
    dlg = document.createElement("div"); dlg.className = "modal"; dlg.setAttribute("role", "dialog"); dlg.setAttribute("aria-modal", "true");
    card = document.createElement("div"); card.className = "modal-card dialog"; dlg.appendChild(card); document.body.appendChild(dlg);
    let inicioFora = false;   // fecha só se o clique começou E terminou no fundo (selecionar texto arrastando não fecha a janela)
    dlg.addEventListener("pointerdown", e => { inicioFora = e.target === dlg; });
    dlg.addEventListener("click", e => { if(e.target === dlg && inicioFora && !card.querySelector("[data-ocupado]")) fecharDialogo(); inicioFora = false; });
    document.addEventListener("keydown", e => { if(e.key === "Escape" && dlg.classList.contains("open") && !card.querySelector("[data-ocupado]")) fecharDialogo(); });
  }
  function abrirDialogo(html, largo){
    garantirDialogo(); card.className = "modal-card dialog" + (largo ? " largo" : ""); card.innerHTML = html; dlg.classList.add("open");
    const f = card.querySelector("[data-foco]") || card.querySelector("input,textarea,select,button"); if(f) setTimeout(() => f.focus(), 30);
    return card;
  }
  function fecharDialogo(){ if(dlg) dlg.classList.remove("open"); }
  function ocupado(botao, texto){ botao.disabled = true; botao.dataset.ocupado = "1"; botao.dataset.txt = botao.innerHTML; botao.innerHTML = `<span class="spin"></span> ${esc(texto)}`; }
  function livre(botao, texto){ botao.disabled = false; delete botao.dataset.ocupado; botao.innerHTML = texto != null ? esc(texto) : (botao.dataset.txt || ""); }

  function confirmar(titulo, texto, rotulo, opcoes){
    opcoes = opcoes || {};
    return new Promise(res => {
      const c = abrirDialogo(`<header><h2>${esc(titulo)}</h2><p>${esc(texto)}</p></header>
        ${opcoes.campo ? `<div class="body"><label class="field">${esc(opcoes.campo)}<textarea id="cf-txt" rows="3" maxlength="1000" data-foco></textarea><span class="err">Campo obrigatório.</span></label></div>` : ""}
        <footer><button class="btn" type="button" id="cf-nao">Voltar</button><button class="btn ${opcoes.perigo ? "danger-fill" : "primary"}" type="button" id="cf-sim">${esc(rotulo)}</button></footer>`);
      c.querySelector("#cf-nao").onclick = () => { fecharDialogo(); res(null); };
      c.querySelector("#cf-sim").onclick = () => {
        const t = c.querySelector("#cf-txt");
        if(t && opcoes.obrigatorio && !t.value.trim()){ t.closest(".field").classList.add("invalid"); t.focus(); return; }
        fecharDialogo(); res(t ? t.value.trim() : true);
      };
    });
  }

  function aplicarTextos(){
    const C = window.CONFIG || {};
    document.querySelectorAll("[data-cfg]").forEach(el => { if(C[el.dataset.cfg]) el.textContent = C[el.dataset.cfg]; });
  }

  /* Telas pequenas: cada célula recebe o nome da sua coluna (data-label), para as tabelas virarem cartões "rótulo: valor".
     Funciona sozinho em todas as tabelas com cabeçalho, inclusive as que são redesenhadas depois. */
  function rotularTabelas(){
    document.querySelectorAll("table").forEach(t => {
      const ths = t.tHead ? [...t.tHead.rows[0].cells] : []; if(!ths.length) return;
      const nomes = []; ths.forEach(th => { for(let k = 0; k < (th.colSpan || 1); k++) nomes.push(th.textContent.trim()); });
      [...t.tBodies].concat(t.tFoot ? [t.tFoot] : []).forEach(tb => [...tb.rows].forEach(tr => {
        let i = 0;
        [...tr.cells].forEach(td => { if(!td.hasAttribute("data-label")) td.setAttribute("data-label", td.colSpan > 1 ? "" : (nomes[i] || "")); i += td.colSpan || 1; });
      }));
    });
  }
  let tRot;
  new MutationObserver(() => { clearTimeout(tRot); tRot = setTimeout(rotularTabelas, 30); }).observe(document.documentElement, { childList: true, subtree: true });
  document.addEventListener("DOMContentLoaded", rotularTabelas);

  /* Regra de segurança: depois de "minutos" sem mexer na página (mouse, teclado, toque ou rolagem),
     encerra a sessão (gestor) ou reinicia a página (solicitante). No último minuto aparece o aviso
     com contagem regressiva e o botão "Manter conectado" (nesse minuto, só o botão renova o tempo). */
  function inatividade(op){
    const minutos = op.minutos || 15, avisoSeg = op.avisoSeg || 60;
    let ultimo = Date.now(), avisando = false, barra = null;
    const atividade = () => { if(!avisando) ultimo = Date.now(); };
    ["mousemove", "mousedown", "keydown", "wheel", "scroll", "touchstart", "input"].forEach(ev => window.addEventListener(ev, atividade, { passive: true, capture: true }));
    function montar(){
      barra = document.createElement("div");
      barra.className = "inativo-aviso"; barra.setAttribute("role", "alertdialog"); barra.setAttribute("aria-live", "assertive");
      barra.innerHTML = `<div class="ia-icone" aria-hidden="true">⏱</div><div class="ia-txt"><b>${op.titulo || "Você ainda está aí?"}</b><span></span></div><button class="btn primary" type="button">Manter conectado</button>`;
      barra.querySelector("button").onclick = manter;
      document.body.appendChild(barra);
    }
    function mostrar(seg){
      if(!barra) montar();
      const mm = Math.floor(seg / 60), ss = String(seg % 60).padStart(2, "0");
      barra.querySelector(".ia-txt span").textContent = (op.texto || "Por segurança, a sessão será encerrada em {t} por falta de uso.").replace("{t}", mm + ":" + ss);
      if(!barra.classList.contains("on")){ barra.classList.add("on"); setTimeout(() => barra && barra.querySelector("button").focus(), 50); }
    }
    function esconder(){ if(barra) barra.classList.remove("on"); }
    function manter(){ avisando = false; ultimo = Date.now(); esconder(); if(op.aoManter) op.aoManter(); }
    setInterval(() => {
      if(op.ativo && !op.ativo()){ ultimo = Date.now(); avisando = false; esconder(); return; }
      const ocioso = Date.now() - ultimo, limite = minutos * 60000;
      if(ocioso >= limite){ avisando = false; esconder(); ultimo = Date.now(); if(op.aoExpirar) op.aoExpirar(); }
      else if(ocioso >= limite - avisoSeg * 1000){ avisando = true; mostrar(Math.ceil((limite - ocioso) / 1000)); }
    }, 1000);
    return { reiniciar(){ ultimo = Date.now(); avisando = false; esconder(); }, ociosoMs: () => Date.now() - ultimo,
      _simular(ms){ ultimo = Date.now() - ms; } };   // _simular: usado só nos testes automáticos
  }

  /* ---------- Status do pedido em destaque + linha do tempo horizontal (solicitante e gestor) ---------- */
  const SVG = d => `<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
  const ICO_OK = SVG('<path d="M20 6 9 17l-5-5"/>'), ICO_X = SVG('<path d="M18 6 6 18M6 6l12 12"/>'), ICO_RELOGIO = SVG('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>');
  function etapasDoPedido(p){
    const and = p.andamento || [], achar = (...sts) => and.find(a => sts.includes(a.status));
    const antigoFinal = ["Atendido", "Parcialmente atendido"].includes(p.status);   // pedidos de versões anteriores
    const recebido = { t: "Pedido recebido", d: (and[0] || {}).dataISO || p.dataISO, ok: true };
    if(p.status === "Recusado") return [recebido, { t: "Recusado", d: (achar("Recusado") || {}).dataISO, ok: true, erro: true }];
    const ret = achar("Aguardando retirada"), ent = achar("Entrega realizada") || (antigoFinal ? achar("Atendido", "Parcialmente atendido") : null);
    return [recebido,
      { t: "Aguardando retirada", d: ret ? ret.dataISO : (antigoFinal && ent ? ent.dataISO : null), ok: !!ret || antigoFinal || p.status === "Entrega realizada" },
      { t: "Entrega realizada", d: ent ? ent.dataISO : null, ok: p.status === "Entrega realizada" || antigoFinal }];
  }
  /* Etapas concluídas: coloridas com ✓. Próxima etapa: relógio (aguardando). Demais: em cinza, numeradas. */
  function linhaDoTempo(p){
    const et = etapasDoPedido(p), prox = et.findIndex(e => !e.ok);
    return `<ol class="etapas" aria-label="Linha do tempo do pedido">${et.map((e, i) => {
      const est = e.ok ? (e.erro ? "erro" : "feito") : i === prox ? "aguardando" : "futuro";
      const ico = est === "feito" ? ICO_OK : est === "erro" ? ICO_X : est === "aguardando" ? ICO_RELOGIO : `<span>${i + 1}</span>`;
      const leg = { feito: "concluída", erro: "recusado", aguardando: "aguardando", futuro: "próxima etapa" }[est];
      return `<li class="${est}" aria-label="${esc(e.t)}: ${leg}"><span class="et-ico">${ico}</span><b>${esc(e.t)}</b><small>${e.d ? dataHora(e.d) : est === "aguardando" ? "Aguardando…" : "&nbsp;"}</small></li>`;
    }).join("")}</ol>`;
  }
  function cartaoStatus(p){
    const ult = (p.andamento || []).slice(-1)[0];
    return `<div class="status-card s-${SITUACAO_CLASSE[p.status] || "pendente"}"><span class="sc-rot">Status</span><b>${esc(p.status)}</b>${ult ? `<small>Atualizado em ${dataHora(ult.dataISO)}</small>` : ""}</div>`;
  }
  function painelStatus(p){
    const ult = (p.andamento || []).slice(-1)[0];
    return `<div class="status-painel">${cartaoStatus(p)}${linhaDoTempo(p)}</div>${ult && ult.texto ? `<p class="status-msg">${esc(ult.texto)}</p>` : ""}`;
  }

  window.U = { inatividade, linhaDoTempo, cartaoStatus, painelStatus, $, esc, fmt, norm, dataHora, pill, emailOk, mascaraTelefone, toast, abrirDialogo, fecharDialogo, ocupado, livre, confirmar, aplicarTextos, SITUACAO_CLASSE };
})();
